[[mgr.prepend_keymap]]
desc = "Start bunny.yazi"
on = "b"
run = "plugin bunny"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Passw zip"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

# Goto
[[mgr.prepend_keymap]]
on = [ "g", "h" ]       
run = "cd ~"          
desc = "Go to the home directory" 
[[mgr.prepend_keymap]]
on = [ "g", "c" ]
run = "cd ~/.config"    
desc = "Go to the config directory" 
[[mgr.prepend_keymap]]
on = [ "g", "d" ]      
run = "cd ~/.dotfiles"
desc = "Go to the dotfiles directory" 
[[mgr.prepend_keymap]]
on = [ "g", "s" ]
run = "cd ~/Stažené"
desc = "Go to the downloads directory" 
[[mgr.prepend_keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"
desc = "Go to a directory interactively" 
[[mgr.prepend_keymap]]
on = [ "g", "n" ]
run = "cd /nfs"
desc = "Go to NAS" 


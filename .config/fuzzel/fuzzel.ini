[main]
font=Hack Nerd Font:size=13
use-bold=yes
dpi-aware=no
fields=name,filename
prompt=" Hledej... "
placeholder=""
icons-enabled=yes
icon-theme=Papirus
show-actions=no
anchor=center
x-margin=10
y-margin=10
lines=11
width=38
horizontal-pad=10
vertical-pad=1
inner-pad=5
line-height=38
letter-spacing=0
image-size-ratio=0.4
layer=top
exit-on-keyboard-focus-loss=yes
tabs=4
list-executables-in-path = false

[dmenu]
exit-immediately-if-empty=no

[colors]
background=2e3440f0
prompt=cd7bafff
input=cd7bafff
text=aabbccff
match=9D4324ff
selection=64727bff
selection-text=1f1f28ff
selection-match=ffffffff
border=8000ffff

[border]
width=2
radius=0
